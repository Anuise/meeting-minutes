x-mm: &mm
  build: .
  working_dir: /work
  environment:
    # ASR Service 的位址。值放在不進 git 的 .env（ADR-0006）。
    MM_ASR_URL: ${MM_ASR_URL:-}
  volumes:
    - ./rawdata:/work/rawdata:ro
    - ./scripts:/work/scripts:ro
    - ./tests:/work/tests:ro
    - ./glossary.yaml:/work/glossary.yaml:ro
    # Media 是純衍生物，讀寫；rawdata/ 仍維持唯讀（ADR-0006）
    - ./media:/work/media
    - ./notes:/work/notes
    - ./records:/work/records
    - ./output:/work/output
    - ./templates:/work/templates

services:
  mm:
    <<: *mm

  # docker compose run --rm test
  test:
    <<: *mm
    entrypoint: ["pytest"]
    command: ["/work/tests", "-q"]

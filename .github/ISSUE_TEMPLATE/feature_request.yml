name: Feature request
description: 提出新能力或行為調整
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        先寫問題，再寫解法。用 `CONTEXT.md` 的詞彙。

  - type: textarea
    id: problem
    attributes:
      label: 要解決什麼問題
      description: 目前哪裡卡住、卡多久、誰受影響。不要直接寫解法。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 希望系統怎麼做。已知有更簡單的做法也請一併寫。
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影響範圍
      options:
        - Init
        - Ingest
        - Extract
        - Render
        - List
        - Minutes Schema / Markdown Template / Docx Template
        - 跨階段
    validations:
      required: true

  - type: textarea
    id: adr
    attributes:
      label: 是否牴觸既有 ADR
      description: |
        檢查 `docs/adr/`。若牴觸請明確指出並說明為何值得重開，
        例如「Contradicts ADR-0003（不做音訊 ingest）——但值得重開因為…」。
      placeholder: 無牴觸 / 牴觸 ADR-0003，原因是…

  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
